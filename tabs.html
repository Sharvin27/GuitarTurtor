<style>
/* Layout: a dark tab sheet that reads like a score — centered title block, full-width staff rows,
   and a sticky transport dock (with live fretboard) pinned to the bottom edge. */
:root {
  --bg: #13151a;
  --surface: #1b1e25;
  --surface-2: #242831;
  --line: #4b515d;
  --line-soft: #343944;
  --ink: #e9ebef;
  --muted: #8d93a0;
  --accent: #f3a43b;      /* playback cursor / current note */
  --accent-ink: #1b1305;
  --cursor: rgba(243, 164, 59, 0.16);
  --blue: #3d8bfd;        /* transport + selection */
  --blue-soft: rgba(61, 139, 253, 0.13);
  --good: #6fcf8e;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
a { color: var(--blue); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------- header ---------- */
header.song {
  padding-block: 36px 18px;
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
}
.song h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(30px, 5vw, 46px);
  line-height: 1.05;
  margin: 0;
  letter-spacing: 0.005em;
  text-wrap: balance;
}
.song h1 .kind { color: var(--muted); font-weight: 600; }
.byline { color: var(--muted); font-size: 15px; margin: 0; }
.byline a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
.chip {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.02em;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chip span { color: var(--muted); font-weight: 500; }
.hint { color: var(--muted); font-size: 13.5px; margin: 2px 0 0; }
.hint kbd {
  font-family: var(--font-display); font-size: 12px; font-weight: 600;
  padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface);
}

/* ---------- score ---------- */
#score { display: grid; gap: 4px; padding-block: 8px 24px; }
svg.row { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
.staff line { stroke: var(--line); stroke-width: 1; }
.bar { stroke: var(--line); stroke-width: 1.2; }
.sname { fill: var(--muted); font: 600 10px var(--font-display); letter-spacing: 0.04em; }
.tsig { fill: var(--ink); font: 700 30px var(--font-display); }
.mnum { fill: var(--muted); font: 600 12px var(--font-display); cursor: pointer; }
.mnum:hover, .mnum.sel { fill: var(--blue); }
.mhit { fill: transparent; cursor: pointer; }
.loopband { fill: var(--blue-soft); }
.note { cursor: pointer; }
.note rect { fill: var(--bg); rx: 3; }
.note text {
  fill: var(--ink);
  font: 600 14px var(--font-display);
  text-anchor: middle;
  dominant-baseline: central;
  font-variant-numeric: tabular-nums;
}
.note:hover text { fill: var(--blue); }
.note.on rect { fill: var(--accent); }
.note.on text { fill: var(--accent-ink); }
.tech { stroke: var(--muted); stroke-width: 1.3; fill: none; }
.tech-fill { fill: var(--muted); }
.tech-text { fill: var(--muted); font: 600 11px var(--font-display); letter-spacing: 0.03em; }
.stem { stroke: var(--muted); stroke-width: 1.3; }
.beam { stroke: var(--muted); stroke-width: 3; }
.dot { fill: var(--muted); }
.sec-name { fill: var(--ink); font: 700 14px var(--font-display); letter-spacing: 0.02em; }
.sec-sub { fill: var(--muted); font: 500 13px var(--font-display); }
.sec-star { fill: var(--accent); font: 600 12px var(--font-display); }
.sec-star.off { fill: var(--line); }
.sec-link { fill: var(--blue); font: 600 12px var(--font-display); }
.cursor-band { fill: var(--cursor); }
.cursor-line { fill: var(--accent); }

/* ---------- info ---------- */
.info {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 28px;
  padding-block: 20px 40px;
  border-top: 1px solid var(--line-soft);
}
.info section { min-width: 0; }
.info h2 {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 12px;
}
.legend { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; margin: 0; }
.legend dt { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); white-space: nowrap; }
.legend dd { margin: 0; color: var(--muted); font-size: 14px; }
.secs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.secs li { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: baseline; font-size: 14px; }
.secs .t { font-family: var(--font-display); font-weight: 600; color: var(--blue); font-variant-numeric: tabular-nums; text-decoration: none; }
.secs .t:hover { text-decoration: underline; }
.secs .stars { color: var(--accent); letter-spacing: 1px; font-size: 12px; }
.secs .stars i { color: var(--line); font-style: normal; }
.tips { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
.tips b { color: var(--ink); font-weight: 600; }
.note-src { color: var(--muted); font-size: 13px; margin: 14px 0 0; max-width: 65ch; }

/* ---------- dock ---------- */
.dock {
  position: sticky;
  bottom: 0;
  z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-top: 10px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line-soft);
}
.dock-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 10px; }
#fretboard { width: 100%; height: auto; display: block; }
#fretboard[hidden] { display: none; }
.fb-wood { fill: var(--surface-2); }
.fb-fret { stroke: var(--line); stroke-width: 1.5; }
.fb-nut { stroke: var(--muted); stroke-width: 4; }
.fb-str { stroke: var(--muted); }
.fb-inlay { fill: var(--line); }
.fb-num { fill: var(--muted); font: 600 10px var(--font-display); text-anchor: middle; }
.fb-on circle { fill: var(--accent); }
.fb-on text { fill: var(--accent-ink); font: 700 11px var(--font-display); text-anchor: middle; dominant-baseline: central; }
.fb-next circle { fill: none; stroke: var(--blue); stroke-width: 2; }
.fb-next text { fill: var(--blue); font: 700 10px var(--font-display); text-anchor: middle; dominant-baseline: central; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.grp { display: flex; align-items: center; gap: 6px; }
.sep { width: 1px; height: 26px; background: var(--line-soft); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; min-width: 36px; padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line-soft);
  background: var(--surface-2);
  cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.02em;
  text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--line); }
.btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.btn[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--ink); }
.btn.play { height: 44px; width: 56px; background: var(--blue); border-color: var(--blue); color: #fff; border-radius: 10px; }
.btn.play svg { width: 22px; height: 22px; }
.btn.play:hover { filter: brightness(1.08); }
.readout { font-family: var(--font-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 110px; }
.readout span { color: var(--muted); font-weight: 500; }
.speed-val { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
.seg { display: inline-flex; border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; }
.seg button { height: 34px; padding: 0 10px; border: 0; background: var(--surface-2); cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.lbl { color: var(--muted); font-size: 13px; }
.push { margin-left: auto; }
@media (max-width: 720px) {
  .sep { display: none; }
  .push { margin-left: 0; }
  .readout { min-width: 0; }
  .btn .txt { display: none; }
}

/* ---------- song tabs ---------- */
nav.songs { display: flex; gap: 6px; padding-top: 18px; overflow-x: auto; scrollbar-width: none; }
nav.songs a {
  flex: none; text-decoration: none; color: var(--muted);
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.02em;

nav.songs a:hover { color: var(--ink); }
nav.songs a[aria-current="page"] { color: var(--ink); background: var(--surface); border-color: var(--line-soft); border-bottom-color: var(--surface); }
nav.songs::after { content: ""; flex: 1; border-bottom: 1px solid var(--line-soft); }
header.song { padding-block: 22px 10px; }
.hold { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 3 2; fill: none; }

.seg button:disabled { opacity: .45; cursor: default; }

.sym { fill: var(--accent); font: 700 13px var(--font-display); text-anchor: middle; dominant-baseline: central; font-style: italic; }
.sym.slash { font-style: normal; font-size: 15px; }
.sym-bg { fill: var(--bg); }

.views a { font-family: var(--font-display); font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); border: 1px solid var(--line-soft); background: var(--surface); border-radius: 999px; padding: 4px 12px; }
.views a:hover { border-color: var(--blue); }

  },
}) : null;
let ytOK = false;
const useYT = () => yt && ytOK && mode === "orig";
async function loadVideo(s) {
  ytOK = false;
  if (!yt) return;
  setStatus("Loading the original video…");
  try { await yt.load(s.video, `${s.title} · ${s.artist}`); if (s === song) { ytOK = true; setStatus(""); } }
  catch (e) { if (s === song) setStatus("The video can't be embedded here, so the synth guitar will play.", true); }
}

async function start(fromS) {
  const token = ++startToken;
  if (useYT()) {
    stopNodes();
    const lp = loopTimes();
    if (lp && (fromS < lp[0] || fromS >= lp[1])) fromS = lp[0];
    if (!lp && fromS >= END - 0.05) fromS = 0;
    play = { yt: true, lp };
    playing = true;
    yt.play(fromS, speed);
    raf = requestAnimationFrame(frame);
    setPlayIcon();
    return;
  }
  if (yt && yt.ready) yt.pause();
  ensureCtx();
  try { await ctx.resume(); } catch {}
  const useOrig = mode !== "synth" && !!origBuf;
  const useSynth = mode !== "orig" || !origBuf;
  const r = speed;
  let buf = null;
  if (useOrig) { buf = await getStretched(r); if (token !== startToken) return; }
  stopNodes();
  const lp = loopTimes();
  if (lp && (fromS < lp[0] || fromS >= lp[1])) fromS = lp[0];
  if (!lp && fromS >= END - 0.05) fromS = 0;
  let t0 = ctx.currentTime + 0.08;
  if (countIn) { const bp = beatPeriodAt(fromS) / r; for (let k = 0; k < 4; k++) click(t0 + k * bp, k === 0); t0 += 4 * bp; }
  play = { t0, s0: fromS, r, lp, useSynth, schedU: fromS };
  if (useOrig) {
    srcNode = ctx.createBufferSource();
    srcNode.buffer = buf;
    origGain.gain.value = mode === "both" ? 0.7 : 1;
    srcNode.connect(origGain);
    if (lp) { srcNode.loop = true; srcNode.loopStart = lp[0] / r; srcNode.loopEnd = lp[1] / r; }
    srcNode.start(t0, fromS / r);
  }
  bus = newBus();
  playing = true;
  timer = setInterval(tick, 25); tick();
  raf = requestAnimationFrame(frame);
  setPlayIcon();
}
function stopNodes() {
  clearInterval(timer); cancelAnimationFrame(raf);
  if (srcNode) { try { srcNode.stop(); } catch {} srcNode.disconnect(); srcNode = null; }
  if (ctx) killBus();
  play = null;
}
function stop(keep = true) {
  if (playing && keep) pausedS = currentS();
  if (play && play.yt) yt.pause();
  playing = false; startToken++;
  stopNodes();
  setPlayIcon();
}
function tick() {
  const p = play; if (!p) return;
  const uB = p.s0 + (ctx.currentTime + 0.15 - p.t0) * p.r;
  for (let guard = 0; guard < 8 && p.schedU < uB; guard++) {
    let off = 0, segEnd = p.lp ? p.lp[1] : Infinity;
    if (p.lp && p.schedU >= p.lp[1]) {
      const L = p.lp[1] - p.lp[0], j = Math.floor((p.schedU - p.lp[1]) / L + 1e-9), segStart = p.lp[1] + j * L;
      off = segStart - p.lp[0]; segEnd = segStart + L;
    }
    const endU = Math.min(uB, segEnd), a = p.schedU - off, b = endU - off;
    if (p.useSynth) for (const n of notes) if (n.t >= a && n.t < b) playEvent(n, p.t0 + (n.t + off - p.s0) / p.r, p.r, p.lp);
    if (metro) GRID.forEach((g, i) => { if (g >= a && g < b) click(p.t0 + (g + off - p.s0) / p.r, i % 4 === 0); });
    p.schedU = endU;
  }
}
function frame() {
  if (!playing || !play) return;
  if (play.yt) {
    let s = yt.time();
    if (play.lp && s >= play.lp[1]) { yt.seek(play.lp[0]); s = play.lp[0]; }
    if (!play.lp && s >= END) { stop(false); pausedS = 0; updateCursor(0, true); return; }
    updateCursor(s, true);
    raf = requestAnimationFrame(frame);
    return;
  }
  const s = currentS();
  if (!play.lp && s >= END) { stop(false); pausedS = 0; updateCursor(0, true); return; }
  updateCursor(s, true);
  raf = requestAnimationFrame(frame);
}
function seek(s) { pausedS = s; if (playing) start(s); else updateCursor(s, true); }
function restartIfPlaying() { if (playing) start(currentS()); }

/* ---------- loop selection ---------- */
function selectBar(m, extend) {
  if (extend && anchorBar !== null) loopRange = [Math.min(anchorBar, m), Math.max(anchorBar, m)];
  else if (loopRange && loopRange[0] === m && loopRange[1] === m && loopOn) { loopRange = null; loopOn = false; anchorBar = null; }
  else { loopRange = [m, m]; anchorBar = m; }
  if (loopRange) loopOn = true;
  syncLoopUI(); render();
  const s = loopRange ? Math.max(0, timeOfBeat(loopRange[0] * 4) - 0.04) : currentS();
  pausedS = s;
  if (playing) start(s); else updateCursor(s, false);
}
function syncLoopUI() {
  $("loopBtn").setAttribute("aria-pressed", String(loopOn && !!loopRange));
  $("loopTxt").textContent = loopRange
    ? (loopRange[0] === loopRange[1] ? `Loop bar ${loopRange[0] + 1}` : `Loop bars ${loopRange[0] + 1}–${loopRange[1] + 1}`)
    : "Loop";
}

/* ---------- controls ---------- */
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zm7.5 0H18v16h-4.5z"/></svg>';
const playBtn = $("playBtn");
function setPlayIcon() { playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute("aria-label", playing ? "Pause" : "Play"); }
function toggle() { if (playing) { stop(); updateCursor(pausedS, false); } else start(pausedS); }
playBtn.addEventListener("click", toggle);
$("restartBtn").addEventListener("click", () => { const lp = loopTimes(); seek(lp ? lp[0] : 0); });
const SPEEDS = [0.25, 0.4, 0.5, 0.6, 0.75, 0.9, 1, 1.25, 1.5];
function setSpeed(v) { speed = v; store.set("tabs.speed", v); $("speedVal").textContent = Math.round(v * 100) + "%"; restartIfPlaying(); }
$("slower").addEventListener("click", () => { const i = SPEEDS.findIndex(s => s >= speed - 1e-6); setSpeed(SPEEDS[Math.max(0, i - 1)]); });
$("faster").addEventListener("click", () => { const i = SPEEDS.findIndex(s => s >= speed - 1e-6); setSpeed(SPEEDS[Math.min(SPEEDS.length - 1, SPEEDS[i] > speed + 1e-6 ? i : i + 1)]); });
function toggleBtn(id, get, set) { const b = $(id); b.addEventListener("click", () => { set(!get()); b.setAttribute("aria-pressed", String(get())); }); }
$("loopBtn").addEventListener("click", () => {
  if (!loopRange) { const m = Math.floor(Math.max(0, Math.min(beatOfTime(currentS()), TOTAL - 1e-4)) / 4); loopRange = [m, m]; anchorBar = m; loopOn = true; }
  else { loopOn = false; loopRange = null; anchorBar = null; }
  syncLoopUI(); render(); restartIfPlaying();
});
function setMode(m) {
  mode = m === "synth" ? "synth" : "orig"; store.set("tabs.mode", mode);
  $("modeOrig").setAttribute("aria-pressed", String(mode === "orig"));
  $("modeSynth").setAttribute("aria-pressed", String(mode === "synth"));
  restartIfPlaying();
}
$("modeOrig").addEventListener("click", () => setMode("orig"));
$("modeSynth").addEventListener("click", () => setMode("synth"));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    const m = Math.floor(Math.max(0, beatOfTime(currentS())) / 4) + (e.key === "ArrowRight" ? 1 : -1);
    seek(Math.max(0, timeOfBeat(Math.max(0, Math.min(MEASURES - 1, m)) * 4) - 0.04));
  } else if (e.key === "Home") { e.preventDefault(); seek(0); }
});

/* ---------- song switching ---------- */
function buildTabs() {
  const nav = $("songTabs");
  nav.textContent = "";
  SONGS.forEach(s => {
    const a = document.createElement("a");
    a.href = "#" + s.id; a.textContent = s.title;
    if (s === song) a.setAttribute("aria-current", "page");
    nav.appendChild(a);
  });
}
function fillHeader() {
  document.title = song.title;
  $("songTitle").textContent = song.title;
  $("songBy").innerHTML = `${song.kind} by <a href="https://www.youtube.com/shorts/${song.video}" target="_blank" rel="noopener">${song.artist}</a> · ♩ = ${Math.round(song.score.bpm)} · Standard tuning`;
}
function loadSong(id) {
  const next = SONGS.find(s => s.id === id) || SONGS[0];
  if (song === next) return;
  if (playing) stop(false);
  song = next;
  pausedS = 0; loopOn = false; loopRange = null; anchorBar = null;
  buildModel(); buildTabs(); fillHeader(); syncLoopUI();
  render();
  if (yt) loadVideo(song); else loadAudio();
}
addEventListener("hashchange", () => loadSong(location.hash.slice(1)));

/* ---------- boot ---------- */
setPlayIcon();
setSpeed(speed);
setMode(mode);
loadSong(location.hash.slice(1));
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
</html>
